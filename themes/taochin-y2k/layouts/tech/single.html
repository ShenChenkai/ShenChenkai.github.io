{{ define "main" }}
<article class="tech-post">
  <header class="room-head room-head-sideback">
    {{ with .Parent }}<p class="room-back"><a href="{{ .RelPermalink }}">« {{ .Title }}</a></p>{{ end }}
    <h1>{{ .Title }}</h1>
    <time>{{ .Date.Format "2006-01-02" }}</time>
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
