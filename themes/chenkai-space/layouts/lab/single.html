{{ define "main" }}
<div class="lab-page">
  <div class="lab-head">
    <h1 class="page-title">Tree Lab</h1>
    <p class="subtitle">想法树画法小样。每一株都是程序生成：根粗梢细、左右不对称、真的分叉。把光标移到任意枝梢 → 绽放成该条想法的预览窗口。</p>
  </div>

  <!-- One shared hand-drawn ink filter, referenced by the 水墨 specimens. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="ink-rough" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="spec-grid">

    <figure class="spec" data-style="ink" data-seed="7" data-icon="dot" data-stroke="ink">
      <div class="tree-stage">
        <svg class="tree-svg rough" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>水墨枯枝</b> · 墨点<span>斜主干、顿挫、大幅收尖。最“毛笔”、最冷峻。</span></figcaption>
    </figure>

    <figure class="spec" data-style="vine" data-seed="21" data-icon="leaf" data-stroke="accent">
      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>单线藤蔓</b> · 嫩芽<span>近等宽、卷曲蜿蜒、偶生新芽。轻盈、现代。</span></figcaption>
    </figure>

    <figure class="spec" data-style="crown" data-seed="4" data-icon="bud" data-stroke="ink">
      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>自然满冠</b> · 花苞<span>层层分叉铺满树冠。最像真树、最丰富。</span></figcaption>
    </figure>

    <figure class="spec" data-style="minimal" data-seed="14" data-icon="ring" data-stroke="ink">
      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>极简芽枝</b> · 空心环<span>一株瘦新苗、留白多。最干净、最克制。</span></figcaption>
    </figure>

    <figure class="spec" data-style="cherry" data-seed="33" data-icon="bud" data-stroke="ink">
      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>樱花满树</b> · 繁花<span>密冠缀满主题色花苞。最热闹、最浪漫。</span></figcaption>
    </figure>

    <figure class="spec" data-style="crown" data-seed="8" data-icon="ring" data-stroke="accent">
      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 440 340" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g class="tree-ink"></g></svg>
        <div class="tips"></div>
      </div>
      <figcaption><b>线框满冠</b> · 空心环<span>满冠骨架 + 主题色描边。介于真树与图标之间。</span></figcaption>
    </figure>

  </div>
</div>

<style>
.lab-page { max-width: 1040px; }
.lab-head { margin-bottom: 2rem; }
.lab-head .subtitle { color: var(--muted); font-style: italic; max-width: 60ch; }

.spec-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2.5rem 2rem;
}
@media (max-width: 720px) { .spec-grid { grid-template-columns: 1fr; } }

.spec figcaption {
  margin-top: 0.9rem;
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.4;
}
.spec figcaption b { font-weight: 650; }
.spec figcaption span { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
</style>
<script src="/js/thought-tree.js" defer></script>
{{ end }}
