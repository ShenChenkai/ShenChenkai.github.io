<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<link rel="stylesheet" href="/css/main.css?v=redesign9" />
{{ $palette := "midnight" }}{{ $mode := "dark" }}
{{ with (index hugo.Data "site") }}
  {{ with .defaultPalette }}{{ $palette = . }}{{ end }}
  {{ with .defaultMode }}{{ $mode = . }}{{ end }}
{{ end }}
<script>
  (function () {
    var d = { palette: {{ $palette }}, mode: {{ $mode }} };
    window.__SITE_DEFAULTS__ = d;
    var html = document.documentElement;
    html.setAttribute("data-theme", localStorage.getItem("theme") || d.mode);
    html.setAttribute("data-palette", localStorage.getItem("palette") || d.palette);
  })();
</script>
<script src="/js/theme.js" defer></script>
{{ with (index hugo.Data "site") }}{{ with .particles }}
<style>
  :root {
    --dot-gap: {{ .gap | default 16 }}px;
    --dot-opacity: {{ .dotOpacity | default 0.28 }};
    --jitter: {{ .jitter | default 1 }};
    --wave-period: {{ .wavePeriod | default 8 }}s;
    --wave-angle: {{ .waveAngle | default 72 }}deg;
    --wave-opacity: {{ .waveOpacity | default 0.6 }};
  }
</style>
{{ end }}{{ end }}
